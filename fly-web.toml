app = 'car-cost-tracker-web'
primary_region = 'cdg'

[build]
  dockerfile = 'docker/Dockerfile.web'

[env]
  API_URL = 'https://car-cost-tracker-api.fly.dev'
  NODE_ENV = 'production'

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
